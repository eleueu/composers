<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Угадай композитора</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container" id="app">
        <div class="pulse-ring" id="pulseRing"></div>

        <div class="game-content">
            <div class="score-header">
                <span class="score-label">Счёт: <span id="scoreDisplay">0</span></span>
            </div>

            <div class="start-screen" id="startScreen">
                <h1>Угадай</h1>
                <h1 class="subtitle">композитора</h1>
                <p class="start-quote">Огромный и чудесный мир музыки ждёт Вас!</p>
                <button class="btn-start" id="btnStart">Начать игру</button>
            </div>

            <div class="game-screen" id="gameScreen">
                <div class="game-controls">
                    <button class="btn-pause" id="btnPause">Пауза</button>
                    <button class="btn-exit" id="btnExit">Выйти</button>
                </div>

                <div class="options" id="optionsContainer">
                    <button class="btn-option" data-index="0">Композитор А</button>
                    <button class="btn-option" data-index="1">Композитор Б</button>
                </div>

                <div class="work-title" id="workTitle"></div>
                <button class="btn-next" id="btnNext">Следующий вопрос</button>
            </div>

            <div class="result-screen" id="resultScreen">
                <div class="final-score" id="finalScore">0/5</div>
                <h2 id="resultTitle">Отлично!</h2>
                <button class="btn-restart" id="btnRestart">Играть снова</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
